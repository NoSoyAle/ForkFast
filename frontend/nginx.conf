server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas de Angular (SPA): cualquier ruta que no sea un archivo real
    # cae en index.html para que el router de Angular la maneje.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Todo lo que empiece con /api se reenvía al contenedor del backend.
    # Como el navegador solo ve "nginx" (mismo origen), esto elimina
    # cualquier problema de CORS.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
